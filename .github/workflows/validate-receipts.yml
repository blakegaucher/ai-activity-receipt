name: Validate AI Activity Receipts

on:
  push:
    branches:
      - main
    paths:
      - "activity-receipt.schema.json"
      - "examples/**"
      - "validate_receipts.py"
      - "requirements.txt"
      - "docs/INVARIANTS.md"
      - ".github/workflows/validate-receipts.yml"
  pull_request:
    paths:
      - "activity-receipt.schema.json"
      - "examples/**"
      - "validate_receipts.py"
      - "requirements.txt"
      - "docs/INVARIANTS.md"
      - ".github/workflows/validate-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Schema and invariant fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Receipt validator
        run: python validate_receipts.py
