name: Validate AI Activity Receipts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "activity-receipt.schema.json"
      - "activity-record.schema.json"
      - "derive_receipt.py"
      - "examples/**"
      - "adapters/**"
      - "mappings/**"
      - "research/**"
      - "benchmark/**"
      - "validate_receipts.py"
      - "requirements.txt"
      - "requirements-lock.txt"
      - ".gitignore"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/**"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CITATION.cff"
  pull_request:
    paths:
      - "activity-receipt.schema.json"
      - "activity-record.schema.json"
      - "derive_receipt.py"
      - "examples/**"
      - "adapters/**"
      - "mappings/**"
      - "research/**"
      - "benchmark/**"
      - "validate_receipts.py"
      - "requirements.txt"
      - "requirements-lock.txt"
      - ".gitignore"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/**"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CITATION.cff"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONHASHSEED: "0"

jobs:
  validate:
    name: Schema, invariant, and benchmark smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Compile Python sources
        run: python -m compileall -q validate_receipts.py derive_receipt.py adapters mappings research benchmark

      - name: Run repository security smoke test
        run: python research/security_smoke_test.py

      - name: Run public exposure gate
        run: python research/public_exposure_gate.py

      - name: Run third-party inventory preflight
        run: python research/validate_third_party_inventory.py

      - name: Validate repository-local Markdown links
        run: |
          python research/validate_markdown_links.py --self-test
          python research/validate_markdown_links.py

      - name: Validate repository JSON assets
        run: |
          python research/validate_repository_json.py --self-test
          python research/validate_repository_json.py

      - name: Validate protocol JSON
        run: python -m json.tool benchmark/arp003_v0_3/protocol.json > /dev/null

      - name: Run AR-P003 methodology decision-ledger self-test
        run: python benchmark/arp003_v0_3/validate_methodology_decisions.py --self-test

      - name: Validate current AR-P003 methodology decision ledger
        run: python benchmark/arp003_v0_3/validate_methodology_decisions.py

      - name: Run AR-P003 methodology impact-map self-test
        run: python benchmark/arp003_v0_3/validate_methodology_impact.py --self-test

      - name: Validate current AR-P003 methodology impact map
        run: python benchmark/arp003_v0_3/validate_methodology_impact.py

      - name: Run Receipt fixture suite
        run: python validate_receipts.py

      - name: Run canonical-record derivation self-test
        run: python derive_receipt.py --self-test

      - name: Run OpenTelemetry GenAI adapter self-test
        run: python adapters/otel_genai.py --self-test

      - name: Run MCP 2026 adapter self-test
        run: python adapters/mcp_2026.py --self-test

      - name: Run cross-adapter normalization parity self-test
        run: python adapters/cross_adapter_parity.py

      - name: Run interoperability mapping self-test
        run: python mappings/validate_mappings.py

      - name: Run delegation-chain prototype self-test
        run: python research/delegation_chain.py --self-test

      - name: Run candidate-record-v0.2 multi-hop self-test
        run: python research/multi_hop_v02.py

      - name: Run continuity guard
        run: python research/validate_continuity_state.py

      - name: Run heterogeneous workflow derivation pilot
        run: python research/workflow_pilot.py

      - name: Run external evidence-reference self-test
        run: python research/validate_external_evidence.py --self-test

      - name: Run attestation trust-policy self-test
        run: python research/validate_attestation_policy.py --self-test

      - name: Run DSSE research signing/verification self-test
        run: python research/dsse_prototype.py

      - name: Run AR-P003 scorer self-test
        run: python benchmark/arp003_v0_3/score_responses.py --self-test

      - name: Run AR-P003 assignment-generator self-test
        run: python benchmark/arp003_v0_3/generate_assignment.py --self-test

      - name: Run AR-P003 neutral structured-control renderer self-test
        run: python benchmark/arp003_v0_3/render_structured_control.py --self-test

      - name: Run AR-P003 case-package linter self-test
        run: python benchmark/arp003_v0_3/lint_case_packages.py --self-test

      - name: Run AR-P003 leakage-audit self-test
        run: python benchmark/arp003_v0_3/audit_leakage.py --self-test

      - name: Run AR-P003 manual case-review self-test
        run: python benchmark/arp003_v0_3/validate_case_methodology_review.py --self-test

      - name: Validate not-run AR-P003 case-review template
        run: python benchmark/arp003_v0_3/validate_case_methodology_review.py

      - name: Run AR-P003 planning self-test
        run: python benchmark/arp003_v0_3/plan_sample_size.py --self-test

      - name: Run AR-P003 crossed-design planning self-test
        run: python benchmark/arp003_v0_3/plan_crossed_design.py --self-test

      - name: Run AR-P003 offline-runner data self-test
        run: python benchmark/arp003_v0_3/validate_runner_data.py --self-test

      - name: Run AR-P003 runner merge self-test
        run: python benchmark/arp003_v0_3/merge_runner_responses.py --self-test

      - name: Run AR-P003 runner-bundle builder self-test
        run: python benchmark/arp003_v0_3/build_runner_bundles.py --self-test

      - name: Run AR-P003 end-to-end pipeline smoke test
        run: python benchmark/arp003_v0_3/pipeline_smoke_test.py

      - name: Run AR-P003 freeze-readiness self-test
        run: python benchmark/arp003_v0_3/check_freeze_readiness.py --self-test

      - name: Validate current AR-P003 freeze-readiness state
        run: python benchmark/arp003_v0_3/check_freeze_readiness.py

      - name: Run AR-P003 browser-smoke record self-test
        run: python benchmark/arp003_v0_3/validate_browser_smoke.py --self-test

      - name: Run AR-P003 freeze-manifest self-test
        run: python benchmark/arp003_v0_3/freeze_manifest.py --self-test

      - name: Run one-command reproducibility suite
        run: |
          python research/reproduce.py --require-clean-git --output /tmp/reproducibility-report.json
          python -m json.tool /tmp/reproducibility-report.json > /dev/null

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-report-${{ github.sha }}
          path: /tmp/reproducibility-report.json
          if-no-files-found: error
          retention-days: 30
