name: Validate AI Activity Receipts

on:
  push:
    branches:
      - main
    paths:
      - "activity-receipt.schema.json"
      - "examples/**"
      - "benchmark/**"
      - "validate_receipts.py"
      - "requirements.txt"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/validate-receipts.yml"
  pull_request:
    paths:
      - "activity-receipt.schema.json"
      - "examples/**"
      - "benchmark/**"
      - "validate_receipts.py"
      - "requirements.txt"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/validate-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Schema, invariant, and benchmark smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q validate_receipts.py benchmark

      - name: Validate protocol JSON
        run: python -m json.tool benchmark/arp003_v0_3/protocol.json > /dev/null

      - name: Run Receipt fixture suite
        run: python validate_receipts.py

      - name: Run AR-P003 scorer self-test
        run: python benchmark/arp003_v0_3/score_responses.py --self-test
