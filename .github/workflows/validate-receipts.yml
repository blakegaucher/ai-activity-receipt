name: Validate AI Activity Receipts

on:
  push:
    branches:
      - main
    paths:
      - "activity-receipt.schema.json"
      - "activity-record.schema.json"
      - "derive_receipt.py"
      - "examples/**"
      - "adapters/**"
      - "mappings/**"
      - "research/**"
      - "benchmark/**"
      - "validate_receipts.py"
      - "requirements.txt"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/validate-receipts.yml"
  pull_request:
    paths:
      - "activity-receipt.schema.json"
      - "activity-record.schema.json"
      - "derive_receipt.py"
      - "examples/**"
      - "adapters/**"
      - "mappings/**"
      - "research/**"
      - "benchmark/**"
      - "validate_receipts.py"
      - "requirements.txt"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/validate-receipts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Schema, invariant, and benchmark smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q validate_receipts.py derive_receipt.py adapters mappings research benchmark

      - name: Validate protocol JSON
        run: python -m json.tool benchmark/arp003_v0_3/protocol.json > /dev/null

      - name: Run Receipt fixture suite
        run: python validate_receipts.py

      - name: Run canonical-record derivation self-test
        run: python derive_receipt.py --self-test

      - name: Run OpenTelemetry GenAI adapter self-test
        run: python adapters/otel_genai.py --self-test

      - name: Run MCP 2026 adapter self-test
        run: python adapters/mcp_2026.py --self-test

      - name: Run cross-adapter normalization parity self-test
        run: python adapters/cross_adapter_parity.py

      - name: Run interoperability mapping self-test
        run: python mappings/validate_mappings.py

      - name: Run delegation-chain prototype self-test
        run: python research/delegation_chain.py --self-test

      - name: Run candidate-record-v0.2 multi-hop self-test
        run: python research/multi_hop_v02.py

      - name: Run heterogeneous workflow derivation pilot
        run: python research/workflow_pilot.py

      - name: Run external evidence-reference self-test
        run: python research/validate_external_evidence.py --self-test

      - name: Run attestation trust-policy self-test
        run: python research/validate_attestation_policy.py --self-test

      - name: Run DSSE research signing/verification self-test
        run: python research/dsse_prototype.py

      - name: Run AR-P003 scorer self-test
        run: python benchmark/arp003_v0_3/score_responses.py --self-test

      - name: Run AR-P003 assignment-generator self-test
        run: python benchmark/arp003_v0_3/generate_assignment.py --self-test

      - name: Run AR-P003 case-package linter self-test
        run: python benchmark/arp003_v0_3/lint_case_packages.py --self-test

      - name: Run AR-P003 planning self-test
        run: python benchmark/arp003_v0_3/plan_sample_size.py --self-test

      - name: Run AR-P003 freeze-manifest self-test
        run: python benchmark/arp003_v0_3/freeze_manifest.py --self-test
