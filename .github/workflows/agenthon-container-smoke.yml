name: Agenthon participant container smoke (manual only)

# Review candidate only. Install through a separately authorized PR; do not dispatch yet.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CONTAINER_ONLY after separate owner execution approval
        required: true
        type: string
      approved_commit:
        description: Exact reviewed 40-hex commit of competition/agenthon-container-522-pin-1c744e1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agenthon-container-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.repository == 'blakegaucher/ai-activity-receipt' &&
      github.ref == 'refs/heads/competition/agenthon-container-522-pin-1c744e1' &&
      github.sha == inputs.approved_commit &&
      inputs.confirmation == 'CONTAINER_ONLY' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHON_BASE: python:3.13.15-slim@sha256:37134a49d21d2120e4c4d73bb76f8a4ab9aef31f096f7ec2ead48c2feead4332
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Check out only reviewed container files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: competition/agenthon/container
          sparse-checkout-cone-mode: false
          path: owner
      - name: Check out exact Track 4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Agenthon-2026/track4-analysis-public
          ref: 1c744e1d6725340643a533f436517d72b53ca0e1
          persist-credentials: false
          path: track4
      - name: Check out exact v2.5.1 toolkit tag commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Agenthon-2026/Agenthon2026-public
          ref: 50fb2dc2b39c70f4cf81fcd269943782eddfaed0
          persist-credentials: false
          path: toolkit
      - name: Set up matched Python version for host checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.15'
      - name: Install bounded host validation dependencies
        run: |
          python -m pip install jsonschema==4.26.0 numpy==2.5.3 scipy==1.18.1
          python -m pip install --no-deps ./toolkit/common
      - name: Build unchanged public baseline and run one offline smoke
        run: >-
          python owner/competition/agenthon/container/container_gate.py
          --track track4 --toolkit toolkit
          --dockerfile owner/competition/agenthon/container/Dockerfile
          --base "$PYTHON_BASE"
          --evidence "$RUNNER_TEMP/agenthon-container-evidence"

# No registry login/push, model assets, cache action, artifact upload or scored submission.
# The helper prints exact answer bytes and the bounded evidence ledger into the run log.